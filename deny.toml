[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Vulnerabilities remain deny-by-default. Do not add a repository-wide ignore
# for the legacy rustls-webpki copy: any exception must name the advisory and
# document why the affected API is unreachable.
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
# A large desktop graph legitimately contains some duplicate foundational
# crates. Keep those visible without hiding the rest of the policy signal.
multiple-versions = "warn"
wildcards = "warn"
deny = [
  { crate = "openssl", use-instead = "rustls", reason = "Fastpotify's network stack is intentionally rustls-only" },
  { crate = "openssl-sys", use-instead = "rustls", reason = "Do not reintroduce an ambient OpenSSL toolchain" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []
