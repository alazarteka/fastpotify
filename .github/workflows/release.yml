name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: protected ref and dependency policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.release-ref.outputs.source_commit }}
      source_date_epoch: ${{ steps.release-ref.outputs.source_date_epoch }}
      tag_name: ${{ steps.release-ref.outputs.tag_name }}
      tag_object: ${{ steps.release-ref.outputs.tag_object }}
      version: ${{ steps.release-ref.outputs.version }}
    steps:
      - name: Checkout the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify protected signed release ref
        id: release-ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_POLICY: ${{ vars.FASTPOTIFY_RELEASE_POLICY }}
        run: |
          if [ "$RELEASE_POLICY" != "1" ]; then
            echo "FASTPOTIFY_RELEASE_POLICY=1 is required after repository hardening" >&2
            exit 1
          fi
          bash supply-chain/verify-release-ref.sh

      - name: Install locked Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            sandbox = true

      - name: Validate locked flake inputs
        run: nix flake metadata --no-write-lock-file

      - name: Enforce dependency policy in the secret-free sandbox
        run: nix develop .#policy --no-write-lock-file --command bash supply-chain/check.sh

  build:
    name: build (${{ matrix.target }})
    needs: policy
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.policy.outputs.tag_name }}
      SOURCE_COMMIT: ${{ needs.policy.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.policy.outputs.source_date_epoch }}
      TAG_OBJECT: ${{ needs.policy.outputs.tag_object }}
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Fetch reviewed Cargo inputs
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Build offline
        run: cargo build --release --frozen --target ${{ matrix.target }}

      - name: Package unsigned artifact
        shell: bash
        run: |
          set -euo pipefail
          name="fastpotify-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fastpotify.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/fastpotify" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'tag_object=%s\n' "$TAG_OBJECT"
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'source_date_epoch=%s\n' "$SOURCE_DATE_EPOCH"
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'rust_toolchain=1.98.0\n'
          } > "dist/$name/BUILD-METADATA.txt"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -r packaging "dist/$name/"
            rm -rf "dist/$name/packaging/macos"
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
              --numeric-owner -C dist -czf "dist/$name.tar.gz" "$name"
          else
            (cd dist && 7z a -mtc=off -mta=off -mtm=off "$name.zip" "$name")
          fi

      # Inno Setup is supplied by the hosted runner. It is an explicit
      # reproducibility boundary documented in supply-chain/README.md.
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.policy.outputs.version }}"
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\fastpotify.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\fastpotify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hash unsigned artifacts
        shell: bash
        run: |
          set -euo pipefail
          name="fastpotify-${RELEASE_TAG}-${{ matrix.target }}"
          cd dist
          : > "$name.sha256"
          for file in "$name.tar.gz" "$name.zip" "$name-setup.exe"; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$name.sha256"
            fi
          done
          test -s "$name.sha256"

      - name: Upload hashed unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  macos-build:
    name: build unsigned macOS universal app
    needs: policy
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.policy.outputs.tag_name }}
      SOURCE_COMMIT: ${{ needs.policy.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.policy.outputs.source_date_epoch }}
      TAG_OBJECT: ${{ needs.policy.outputs.tag_object }}
      TZ: UTC
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Fetch reviewed Cargo inputs
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-apple-darwin

      - name: Build both architectures offline
        run: |
          cargo build --release --frozen --target aarch64-apple-darwin
          cargo build --release --frozen --target x86_64-apple-darwin

      - name: Build unsigned universal app
        run: |
          set -euo pipefail
          mkdir -p universal unsigned
          lipo -create \
            target/aarch64-apple-darwin/release/fastpotify \
            target/x86_64-apple-darwin/release/fastpotify \
            -output universal/fastpotify
          bash packaging/macos/bundle.sh universal/fastpotify Fastpotify.app \
            '${{ needs.policy.outputs.version }}'
          # bundle.sh adds an ad-hoc signature for local arm64 launches. Remove
          # it so the protected job receives an actually unsigned handoff.
          codesign --remove-signature Fastpotify.app
          if codesign --verify Fastpotify.app 2>/dev/null; then
            echo "pre-sign handoff unexpectedly has a valid signature" >&2
            exit 1
          fi
          ditto -c -k --keepParent Fastpotify.app unsigned/Fastpotify.app.zip
          cp README.md LICENSE unsigned/
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'tag_object=%s\n' "$TAG_OBJECT"
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'source_date_epoch=%s\n' "$SOURCE_DATE_EPOCH"
            printf 'target=universal-apple-darwin\n'
            printf 'rust_toolchain=1.98.0\n'
          } > unsigned/BUILD-METADATA.txt
          cd unsigned
          shasum -a 256 Fastpotify.app.zip > macos-pre-sign.sha256

      - name: Upload hashed pre-sign app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pre-sign
          path: unsigned/*
          if-no-files-found: error
          retention-days: 2

  macos-sign:
    name: protected macOS signing and notarization
    needs: [policy, macos-build]
    runs-on: macos-latest
    environment:
      name: macos-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verified release policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download pre-sign app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-pre-sign
          path: unsigned

      - name: Recheck tag and unsigned handoff
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.policy.outputs.source_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.policy.outputs.tag_object }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash supply-chain/verify-release-ref.sh
          (cd unsigned && shasum -a 256 -c macos-pre-sign.sha256)
          ditto -x -k unsigned/Fastpotify.app.zip .
          if codesign --verify Fastpotify.app 2>/dev/null; then
            echo "refusing to sign an already signed handoff" >&2
            exit 1
          fi

      - name: Sign, package, and notarize without project execution
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/fastpotify-signing.keychain-db"
          certificate="$RUNNER_TEMP/fastpotify-signing.p12"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          cleanup() {
            /usr/bin/security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT INT TERM
          cleanup

          for required in \
            APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "missing protected environment value: $required" >&2
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"

          # Sign nested executable code first, then the bundle. Never use --deep:
          # it hides an incomplete understanding of the bundle's code topology.
          /usr/bin/codesign --force --options runtime --timestamp \
            --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" \
            Fastpotify.app/Contents/MacOS/fastpotify
          /usr/bin/codesign --force --options runtime --timestamp \
            --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" Fastpotify.app
          /usr/bin/codesign --verify --strict --verbose=2 Fastpotify.app

          name="fastpotify-${{ needs.policy.outputs.tag_name }}-macos-universal"
          stage="$RUNNER_TEMP/fastpotify-dmg"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          cp -R Fastpotify.app "$stage/"
          cp README.md LICENSE "$stage/"
          ln -s /Applications "$stage/Applications"
          /usr/bin/hdiutil create -volname Fastpotify -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"
          /usr/bin/codesign --force --timestamp --keychain "$keychain" \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/$name.dmg"
          /usr/bin/xcrun notarytool submit "dist/$name.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          /usr/bin/xcrun stapler staple "dist/$name.dmg"
          /usr/bin/xcrun stapler validate "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.dmg" > "$name.sha256")

      - name: Unconditionally remove signing material
        if: ${{ always() }}
        run: |
          /usr/bin/security delete-keychain \
            "$RUNNER_TEMP/fastpotify-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/fastpotify-signing.p12"

      - name: Upload signed and notarized artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest final release artifacts
    needs: [policy, build, macos-sign]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.policy.outputs.tag_name }}
    steps:
      - name: Download final artifacts only
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify handoff hashes and consolidate checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          manifests=(*.sha256)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "no per-build checksum manifests found" >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            sha256sum --check "$manifest"
          done
          checksum_tmp="$(mktemp)"
          for file in *; do
            case "$file" in
              *.sha256|SHA256SUMS) ;;
              *) sha256sum "$file" >> "$checksum_tmp" ;;
            esac
          done
          test -s "$checksum_tmp"
          LC_ALL=C sort -k2 "$checksum_tmp" > SHA256SUMS
          rm -f "$checksum_tmp"

      - name: Attest consolidated artifact subjects
        id: provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Include offline-verifiable Sigstore bundle
        run: |
          cp '${{ steps.provenance.outputs.bundle-path }}' \
            "dist/fastpotify-${RELEASE_TAG}-attestation.json"

      - name: Upload attested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: protected GitHub release publish
    needs: [policy, attest]
    runs-on: ubuntu-24.04
    environment:
      name: release-publishing
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout verified release policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download attested release set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-ready
          path: dist

      - name: Recheck tag and final checksums
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.policy.outputs.source_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.policy.outputs.tag_object }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash supply-chain/verify-release-ref.sh
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish immutable release inputs
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.policy.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
